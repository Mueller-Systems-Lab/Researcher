# =============================================================================
# /etc/systemd/system/ollama.service.d/override.conf
# =============================================================================
# Anwendung:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp override.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
# =============================================================================

[Service]

# LLM NIEMALS automatisch entladen (nur manuell via ollama stop)
Environment="OLLAMA_KEEP_ALIVE=-1"

# Maximal 1 Modell gleichzeitig im VRAM (verhindert Verdrängung)
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Kein paralleles Laden (reduziert VRAM-Spitzen)
Environment="OLLAMA_NUM_PARALLEL=1"

# Flash Attention 2 (spart VRAM bei langen Kontexten)
Environment="OLLAMA_FLASH_ATTENTION=1"

# Explizite GPU-Auswahl
Environment="CUDA_VISIBLE_DEVICES=0"
