# Issue Verification Workflow
# Prüft regelmäßig, ob alle Issues korrekt gegen Code implementiert sind
# Quelle: scripts/verify-issues.sh (Phase 7)

name: Issue Verifikation

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 9 * * 1'  # Jeden Montag um 9:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verifikations-Modus (all/closed/deep/security)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - closed
          - deep
          - security
          - release

jobs:
  verify-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true

      - name: GitHub CLI Auth
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run Issue Verification
        id: verify
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          chmod +x scripts/verify-issues.sh
          ./scripts/verify-issues.sh --github-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-verification-report
          path: |
            reports/issue-verification/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          REPORT=$(ls -t reports/issue-verification/verify-report-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            echo "## Issue Verification Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            head -30 "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full report: $REPORT" >> $GITHUB_STEP_SUMMARY
          fi
