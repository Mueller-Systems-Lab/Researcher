# Researcher CI Fast Gate — GitHub Actions
# Run on every push/PR: quality + coverage + e2e (matrix: Python 3.11, 3.12)
name: CI Fast Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-cov
          pip install -r requirements.txt

      - name: Quality gate (lint + typecheck + security + tests)
        run: make quality

      - name: Coverage gate
        run: make coverage

      - name: E2E pipeline tests
        run: make test-e2e

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: coverage_html/
          if-no-files-found: ignore

  playwright:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run Playwright tests
        run: make playwright

      - name: Upload artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            tests/playwright/screenshots/
            tests/playwright/baselines/
          if-no-files-found: ignore
