# SearXNG Limiter-Konfiguration
# Der Limiter ist in settings.yml deaktiviert (server.limiter: false).
# Diese Datei bleibt vorbereitend für den Fall, dass der Limiter aktiviert wird.
[botdetection]
ipv4_prefix = 32
ipv6_prefix = 48
trusted_proxies = [
  '127.0.0.0/8',
  '::1',
]

[botdetection.ip_limit]
filter_link_local = false
link_token = false

[botdetection.ip_lists]
pass_ip = [
  '127.0.0.0/8',
  '::1',
]
pass_searxng_org = true
