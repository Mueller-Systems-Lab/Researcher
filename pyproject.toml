[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "researcher"
version = "0.1.0"
description = "Lokales, unzensiertes Research-System"
requires-python = ">=3.11"

[tool.coverage.run]
source = [
    "config",
    "crawlers",
    "darknet_search",
    "dashboard",
    "mcp_tools",
    "onion_discovery",
    "search",
    "vectordb",
]
omit = [
    "*/__main__.py",
    "*/tests/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
]
# Aktuell: 77 % (T-025) — ohne externe Dienste erreichbar
# Lücken: darknet_crawler.py (Login/Crawl braucht Tor), server.py (HTTP braucht Integration)
# Mit laufenden Diensten (Ollama, SearXNG, Tor): Ziel 85 %
fail_under = 75

[tool.coverage.html]
directory = "coverage_html"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
