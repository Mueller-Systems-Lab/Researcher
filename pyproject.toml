[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "researcher"
version = "0.1.0"
description = "Lokales, unzensiertes Research-System"
requires-python = ">=3.11"

[tool.coverage.run]
source = [
    "config",
    "crawlers",
    "darknet_search",
    "dashboard",
    "mcp_tools",
    "evidence_store",
    "onion_discovery",
    "research_orchestrator",
    "research_planner",
    "research_workers",
    "searcher_pipeline",
    "evidence_store",
    "deep_report",
    "search",
    "vectordb",
]
omit = [
    "*/__main__.py",
    "*/tests/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
]
# Aktuell: 81 % (Crawler-Tests Issue #43) — ohne externe Dienste
# Mit RUN_E2E_TESTS=true + Playwright (PR #45): 85 %+
fail_under = 81

[tool.coverage.html]
directory = "coverage_html"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gpt_researcher.*"]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "gpt_researcher/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# Playwright-Tests: Enthalten eingebettetes JavaScript (String-Literale)
"tests/playwright/*.py" = ["E501"]
# Security-Tests: Lange Docstrings für Angriffsvektor-Dokumentation
"tests/security/*.py" = ["E501"]
# Scripts mit sys.path-Manipulation vor Imports (architekturbedingt)
"scripts/deep_research.py" = ["E501"]
"scripts/patch_gpt_researcher.py" = ["E402"]
"scripts/start-with-dashboard.py" = ["E402"]
# E2E-Tests: Lange Mock-Datenstrings
"tests/e2e/*.py" = ["E501"]
# Infra-Skripte: sys.path-Imports + Utility-Code
"infra/*.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: End-to-End-Tests mit gemockten oder optionalen externen Abhängigkeiten",
    "asyncio: AsyncIO-basierte Tests",
    "playwright: Browser- und Playwright-Tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
