<!DOCTYPE html>
<html lang="de" role="application" aria-label="GPU-Dashboard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU-Dashboard — Researcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
  }
  #metrics { transition: opacity 0.5s ease; opacity: 0; }
  h1 {
    font-size: 1.5em;
    margin-bottom: 20px;
    color: #58a6ff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .card .label {
    font-size: 0.8em;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .value {
    font-size: 2em;
    font-weight: bold;
    margin-top: 8px;
  }
  .card .unit { font-size: 0.5em; color: #8b949e; }
  .bar-container {
    background: #21262d;
    border-radius: 12px;
    height: 20px;
    margin-top: 12px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    border-radius: 12px;
    transition: width 0.5s ease, background 0.5s ease;
    background: #238636;
  }
  .bar.warning { background: #d29922; }
  .bar.critical { background: #da3633; }
  .warning-text {
    color: #d29922;
    font-weight: bold;
    animation: pulse 1.5s infinite;
  }
  .critical-text {
    color: #da3633;
    font-weight: bold;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #21262d;
  }
  th { color: #8b949e; font-size: 0.8em; }
  .error {
    color: #da3633;
    text-align: center;
    padding: 40px;
  }
  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.ok { background: #3fb950; }
  .status-dot.warning { background: #d29922; }
  .status-dot.critical { background: #da3633; }
  .status-dot.error-dot { background: #8b949e; }
  .loading-skeleton {
    background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
    height: 1.2em;
    width: 80%;
    margin: 8px auto;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .loading-text { color: #58a6ff; font-size: 0.9em; margin-top: 8px; animation: pulse 1.5s infinite; }
  .connection-status {
    font-size: 0.8em;
    margin-top: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    display: inline-block;
  }
  .connection-status.connected { color: #3fb950; }
  .connection-status.disconnected { color: #da3633; background: #21262d; }
  .connection-status.connecting { color: #d29922; background: #21262d; }
</style>
</head>
<body>

<h1>⚙ GPU-Dashboard</h1>

<div id="query-display" style="margin-bottom:12px;color:#8b949e;font-size:0.9em"></div>

<div id="connection-status" class="connection-status connecting">🔄 Verbinde zum GPU-Monitor...</div>

<div id="error" class="error" style="display:none" role="alert" aria-live="assertive"></div>

<!-- Loading-Skeleton (wird bei erstem Datenempfang ausgeblendet) -->
<div id="loading-overlay" style="text-align:center;padding:40px;">
  <div class="loading-text">GPU-Daten werden geladen...</div>
  <div class="loading-skeleton"></div>
  <div class="loading-skeleton" style="width:60%"></div>
  <div class="loading-skeleton" style="width:70%"></div>
</div>

<div class="grid" id="metrics" aria-label="GPU-Metriken" role="region">
  <div class="card" role="status" aria-label="GPU-Auslastung">
    <div class="label">GPU-Auslastung</div>
    <div class="value" id="gpu-util" aria-live="polite" aria-atomic="true">--</div>
    <div class="bar-container">
      <div class="bar" id="gpu-bar" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="GPU-Auslastung Fortschritt"></div>
    </div>
  </div>
  <div class="card" role="status" aria-label="VRAM-Verbrauch">
    <div class="label">VRAM-Verbrauch</div>
    <div class="value" id="vram-used" aria-live="polite" aria-atomic="true">-- <span class="unit">MiB</span></div>
    <div class="bar-container">
      <div class="bar" id="vram-bar" style="width:0%" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="VRAM-Verbrauch Fortschritt"></div>
    </div>
  </div>
  <div class="card" role="status" aria-label="Temperatur">
    <div class="label">Temperatur</div>
    <div class="value" id="gpu-temp" aria-live="polite" aria-atomic="true">-- <span class="unit">°C</span></div>
  </div>
  <div class="card" role="status" aria-label="GPU-Name">
    <div class="label">GPU-Name</div>
    <div class="value" style="font-size:1em" id="gpu-name" aria-live="polite" aria-atomic="true">--</div>
  </div>
</div>

<div class="card" role="region" aria-label="GPU-Prozesse">
  <div class="label">GPU-Prozesse</div>
  <table aria-label="GPU-Prozessliste">
    <thead><tr><th>PID</th><th>Name</th><th>VRAM (MiB)</th></tr></thead>
    <tbody id="process-list" aria-live="polite">
      <tr><td colspan="3">Keine Prozesse</td></tr>
    </tbody>
  </table>
</div>

<p style="margin-top:20px;color:#8b949e;font-size:0.8em" id="timestamp" aria-live="polite" aria-atomic="true"></p>

<script>
let reconnectAttempts = 0;
let eventSource = null;
const MAX_RECONNECT_DELAY = 30000; // 30s max delay

function connectSSE() {
  eventSource = new EventSource('/api/gpu/stream');

  // Query-Parameter 'q' sicher anzeigen (textContent, kein innerHTML)
  const queryParam = new URLSearchParams(window.location.search).get('q');
  if (queryParam) {
    document.getElementById('query-display').textContent = '🔍 Suche: ' + queryParam;
  }

  eventSource.onopen = function() {
    reconnectAttempts = 0;
    document.getElementById('connection-status').textContent = '✅ Verbunden';
    document.getElementById('connection-status').className = 'connection-status connected';
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('metrics').style.opacity = '1';
  };

  eventSource.onmessage = function(event) {
    try {
      const data = JSON.parse(event.data);
      updateDashboard(data);
      // Hide loading state on first data
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('metrics').style.opacity = '1';
    } catch (e) {
      if (typeof console !== 'undefined') {
        // Keep parse errors silent in production
      }
    }
  };

  eventSource.onerror = function() {
    // Show error message
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = '⚠ Verbindung zum GPU-Monitor unterbrochen. Versuche erneut zu verbinden...';
    document.getElementById('error').className = 'error';
    document.getElementById('connection-status').textContent = '⚠ Verbindung unterbrochen';
    document.getElementById('connection-status').className = 'connection-status disconnected';

    // Exponential backoff reconnect
    eventSource.close();
    reconnectAttempts++;
    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
    if (typeof console !== 'undefined') {
      console.log('SSE reconnect in ' + (delay / 1000) + 's (attempt ' + reconnectAttempts + ')');
    }
    setTimeout(function() {
      document.getElementById('connection-status').textContent = '🔄 Erneute Verbindung (' + reconnectAttempts + ')...';
      document.getElementById('connection-status').className = 'connection-status connecting';
      connectSSE();
    }, delay);
  };
}

// Initial connection
connectSSE();

function updateDashboard(data) {
  if (data.error) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = '⚠ ' + data.error;
    return;
  }
  document.getElementById('error').style.display = 'none';

  // GPU-Auslastung
  document.getElementById('gpu-util').textContent = Math.round(data.gpu_utilization) + ' %';
  const gpuBar = document.getElementById('gpu-bar');
  gpuBar.style.width = Math.round(data.gpu_utilization) + '%';
  gpuBar.className = 'bar ' + (data.gpu_utilization > 90 ? 'critical' : data.gpu_utilization > 70 ? 'warning' : '');
  gpuBar.setAttribute('aria-valuenow', Math.round(data.gpu_utilization));

  // VRAM
  const used = data.memory_used_mib;
  const total = data.memory_total_mib;
  const pct = data.memory_percent;
  // textContent statt innerHTML für Plaintext (XSS-Schutz)
  const vramEl = document.getElementById('vram-used');
  vramEl.textContent = used + ' / ' + total + ' MiB';

  const vramBar = document.getElementById('vram-bar');
  vramBar.style.width = Math.round(pct) + '%';
  vramBar.className = 'bar ' + (data.warning_level === 'critical' ? 'critical' : data.warning_level === 'warning' ? 'warning' : '');
  vramBar.setAttribute('aria-valuenow', Math.round(pct));
  document.getElementById('vram-used').className = data.warning_level === 'critical' ? 'value critical-text' : data.warning_level === 'warning' ? 'value warning-text' : 'value';

  // Temperatur
  document.getElementById('gpu-temp').textContent = Math.round(data.temperature_c) + ' °C';

  // GPU-Name
  document.getElementById('gpu-name').textContent = data.gpu_name || '--';

  // Prozesse — DOM-API statt innerHTML (XSS-Schutz, Block 3.4)
  const procBody = document.getElementById('process-list');
  procBody.textContent = ''; // Clear sicher
  if (data.processes && data.processes.length > 0) {
    data.processes.forEach(function(p) {
      const tr = document.createElement('tr');
      const tdPid = document.createElement('td');
      tdPid.textContent = p.pid;
      const tdName = document.createElement('td');
      tdName.textContent = p.name;
      const tdMem = document.createElement('td');
      tdMem.textContent = p.memory_mib;
      tr.appendChild(tdPid);
      tr.appendChild(tdName);
      tr.appendChild(tdMem);
      procBody.appendChild(tr);
    });
  } else {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.setAttribute('colspan', '3');
    td.textContent = 'Keine GPU-Prozesse';
    tr.appendChild(td);
    procBody.appendChild(tr);
  }

  // Timestamp
  document.getElementById('timestamp').textContent = 'Letzte Aktualisierung: ' + new Date(data.timestamp).toLocaleTimeString();
}
</script>

</body>
</html>
